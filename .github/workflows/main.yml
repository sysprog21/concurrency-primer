name: build-deploy-pdf

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Default token is read-only; the release job re-grants write below.
permissions:
  contents: read

# Cancel superseded PR runs to save minutes, but never interrupt a push to
# main: that run publishes the release and moves the "latest" tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  examples:
    name: Check C examples
    # Pinned rather than ubuntu-latest so the toolchain this job installs is
    # reproducible; each check lives in .ci/ so it can be run locally too.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-lint-${{ runner.os }}-${{ hashFiles('.github/workflows/main.yml') }}

      - name: Install tools
        # clang-format-20 specifically: the accepted style is whatever that
        # release produces, and the image's default clang-format is a
        # different major version.
        run: |
          mkdir -p ~/apt-cache
          sudo apt-get update -qq
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" \
            clang-format-20 cppcheck

      - name: Check trailing newline
        run: .ci/check-newline.sh

      - name: Check clang-format
        run: |
          .ci/check-format.sh || {
            echo "::error::examples/*.c is not formatted; run 'make -C examples format' and commit the result."
            exit 1
          }

      - name: Security checks
        run: .ci/check-security.sh

      - name: Static analysis (cppcheck)
        run: .ci/check-cppcheck.sh

      - name: Build and run the examples
        # The book embeds these files verbatim, so a program that no longer
        # compiles, no longer terminates, or no longer prints what the
        # manuscript quotes ships straight into the PDF.
        run: make -C examples check

  build:
    name: Build PDF
    runs-on: ubuntu-latest
    # Pinned by digest so a future texlive/texlive:latest push cannot
    # silently change the rendered PDF or break the build.
    # Digest as of 2026-05-10 (texlive/texlive:latest).
    container: texlive/texlive@sha256:a38949128a1828f251bb5b4b2ec945644eb4962ce3adae1996f5edc839629bd1
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Mark workspace safe for git
        # The texlive container runs as root; git refuses to operate on
        # a workspace owned by another UID without this exemption.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        # The texlive/texlive image does not ship with wget, which the
        # Makefile uses to fetch lstlangarm.sty. Install it explicitly.
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends wget ca-certificates

      - name: Cache TeX intermediates and minted highlights
        uses: actions/cache@v6
        with:
          path: |
            concurrency-primer.aux
            concurrency-primer.fdb_latexmk
            concurrency-primer.fls
            concurrency-primer.out
            concurrency-primer.toc
            _minted
          # The sources hash changes on nearly every push, so the prefix
          # fallback below does the real work. A stale aux/toc costs latexmk
          # one extra pass; _minted entries are content-addressed, so unmatched
          # ones are ignored rather than reused wrongly.
          #
          # lstlangarm.sty stays out of the cache. The Makefile fetches it from
          # a floating master URL, so a cached copy would pin the build to
          # whatever revision landed in the cache first.
          # The workflow file is in the hash because the texlive digest lives
          # there: a new image means a new pygments, and minted keys its
          # entries by listing content alone, so stale ones would still match
          # and the PDF would mix two highlighting styles.
          # The workflow hash is its own key segment, not just folded into the
          # whole, so the fallback below can be scoped to it. A bare
          # "tex-${{ runner.os }}-" prefix would happily restore _minted built
          # by a different pygments after a digest bump, which is the mixed
          # highlighting the exact key exists to prevent.
          key: tex-${{ runner.os }}-${{ hashFiles('.github/workflows/main.yml') }}-${{ hashFiles('concurrency-primer.tex', 'Makefile', 'lib/**/*.tex', 'examples/**/*.c') }}
          restore-keys: |
            tex-${{ runner.os }}-${{ hashFiles('.github/workflows/main.yml') }}-

      - name: Build PDF
        run: make 2>&1 | tee build.log

      - name: Verify output exists
        run: |
          test -s concurrency-primer.pdf
          ls -lh concurrency-primer.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: concurrency-primer-pdf
          path: concurrency-primer.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: |
            build.log
            concurrency-primer.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish latest release
    # Both, not just build: latexmk typesets the examples from source and
    # succeeds whether or not they compile, so only the examples job can stop
    # a broken program from shipping inside the PDF.
    needs: [build, examples]
    # Release on a direct push to main, or on a manual run against main. PRs
    # run the build job above for validation but never reach this job, so no
    # "main" tag is ever created.
    #
    # workflow_dispatch is the recovery path: when a push's run is lost, and
    # a queue backlog or a cancelled run is enough to lose one, there is
    # otherwise no way to publish that commit short of pushing another.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        # A shallow clone suffices; force-moving the tag to HEAD walks no
        # history, and the remote already has that commit.
        uses: actions/checkout@v7

      - name: Download PDF artifact
        uses: actions/download-artifact@v8
        with:
          name: concurrency-primer-pdf

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: concurrency-primer.pdf
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          prerelease: true
          body: |
            Automatically built PDF from the latest commit on `main`.

            Source commit: ${{ github.sha }}

      - name: Move latest tag to current commit
        # On the first publish, action-gh-release can create "latest" at the
        # current commit via target_commitish. On later publishes, the Releases
        # API updates assets/body but leaves an existing tag in place, so move
        # the ref only after the upload succeeds.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa latest -m "Latest build from ${GITHUB_SHA::7}"
          git push origin refs/tags/latest --force
