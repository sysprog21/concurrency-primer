version: 2

updates:
  # Actions referenced by .github/workflows/*.yml. `directory: /` is correct
  # here: the github-actions ecosystem always scans .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "00:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
